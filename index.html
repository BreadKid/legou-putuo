<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>山姆羊毛清单</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f5f5; padding-bottom: 140px; }
  #groups, #list { padding: 0 12px; }
  #groups { margin: 10px 0 14px; }
  .group { background: #fff; border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
  .g-head { padding: 12px 14px; display: flex; align-items: center; gap: 8px;
            font-size: 15px; cursor: pointer; flex-wrap: wrap; }
  .g-head .label { font-weight: 600; }
  .g-head .stat { flex: 1; color: #666; font-size: 13px; min-width: 0; }
  .g-head .warn { color: #d97706; font-size: 12px; }
  .g-head .bad  { color: #dc2626; font-size: 12px; }
  .g-head .ok   { color: #059669; font-size: 12px; }
  .g-head .arrow { color: #bbb; font-size: 12px; transition: transform .2s; }
  .group.open .arrow { transform: rotate(90deg); }
  .g-body { display: none; border-top: 1px solid #f0f0f0; }
  .group.open .g-body { display: block; }
  .g-row { display: flex; gap: 10px; padding: 10px 14px; border-bottom: 1px solid #f5f5f5;
           align-items: center; font-size: 14px; cursor: pointer; }
  .g-row:last-child { border-bottom: none; }
  .g-row img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; cursor: zoom-in; }
  .g-row .gm { flex: 1; min-width: 0; }
  .g-row .gidx { font-size: 11px; color: #999; }
  .g-row .gp { color: #333; }
  .g-row .gt { font-weight: 600; }

  #listHeader { display: flex; align-items: center; gap: 10px; padding: 0 12px; margin-bottom: 8px; }
  #listHeader .t { flex: 1; font-size: 14px; color: #666; }
  .item { display: flex; gap: 10px; background: #fff; border-radius: 10px;
          padding: 10px; margin-bottom: 10px; align-items: center; }
  .item img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; flex-shrink: 0; cursor: zoom-in; }
  .mid { flex: 1; min-width: 0; }
  .mid .idx { font-size: 12px; color: #999; margin-bottom: 4px; }
  .price-input { width: 100%; font-size: 18px; padding: 8px 10px;
                 border: 1px solid #ddd; border-radius: 6px; }
  .qty { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .qty button { width: 32px; height: 32px; border: 1px solid #ddd; border-radius: 6px;
                background: #f7f7f7; font-size: 18px; line-height: 1; }
  .qty .n { min-width: 28px; text-align: center; font-size: 17px; font-weight: 600; }
  .del { flex-shrink: 0; width: 36px; height: 36px; border: none; border-radius: 50%;
         background: #ff3b30; color: #fff; font-size: 18px; }

  .item.flash { animation: flash 1.2s; }
  @keyframes flash {
    0%, 60% { background: #fff3cd; }
    100% { background: #fff; }
  }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
            border-top: 1px solid #e5e5e5; padding: 10px 16px 14px;
            display: flex; flex-direction: column; gap: 8px; }
  #people { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #666; }
  #people button { width: 28px; height: 28px; border: 1px solid #ddd; border-radius: 6px;
                   background: #f7f7f7; font-size: 16px; line-height: 1; }
  #people .n { min-width: 20px; text-align: center; font-weight: 600; }
  #summaryRow { display: flex; align-items: flex-end; gap: 12px; }
  #summaryRow .left { flex: 1; min-width: 0; }
  #gross { font-size: 13px; color: #999; }
  #net   { font-size: 20px; font-weight: 700; }
  #save  { font-size: 13px; color: #059669; }
  #addBtn { background: #07c160; color: #fff; border: none; border-radius: 8px;
            font-size: 18px; padding: 10px 22px; }
  #empty { text-align: center; color: #aaa; margin-top: 40px; font-size: 15px; }
  #viewer { position: fixed; inset: 0; background: rgba(0,0,0,.9); display: none;
            align-items: center; justify-content: center; z-index: 10; }
  #viewer img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>

<div id="groups"></div>

<div id="listHeader"><span class="t">总列表（修改后自动重新分组）</span></div>
<div id="list"></div>
<div id="empty">点底部按钮拍照添加商品</div>

<div id="bottom">
  <div id="people">
    人数（优惠额度）
    <button id="pMinus">−</button>
    <span class="n" id="pNum">1</span>
    <button id="pPlus">＋</button>
  </div>
  <div id="summaryRow">
    <div class="left">
      <div id="gross">原价 ¥0.00</div>
      <div id="save">共省 ¥0.00</div>
      <div id="net">实付 ¥0.00</div>
    </div>
    <button id="addBtn">＋ 拍照</button>
  </div>
</div>
<input type="file" id="camera" accept="image/*" capture="environment" hidden>

<div id="viewer"><img alt=""></div>

<script>
const groupsEl = document.getElementById('groups');
const listEl   = document.getElementById('list');
const emptyEl  = document.getElementById('empty');
const camera   = document.getElementById('camera');
const viewer   = document.getElementById('viewer');
const pNumEl   = document.getElementById('pNum');

const MAX_EDGE = 1600, QUALITY = 0.8;

let people = 1;
let items = []; // {thumb, full, price, qty}
let openGroups = new Set();

document.getElementById('addBtn').onclick = () => camera.click();
document.getElementById('pMinus').onclick = () => setPeople(people - 1);
document.getElementById('pPlus').onclick  = () => setPeople(people + 1);

function setPeople(n) {
  if (n < 1) return;
  people = n;
  openGroups.clear();
  render();
}

camera.onchange = async () => {
  const file = camera.files[0];
  camera.value = '';
  if (!file) return;
  const img = await loadImage(file);
  const w = img.naturalWidth, h = img.naturalHeight;
  const scale = Math.min(1, MAX_EDGE / Math.max(w, h));
  const full = blobUrl(img, w * scale, h * scale, QUALITY);
  const tScale = Math.min(scale, 300 / Math.max(w, h));
  const thumb = blobUrl(img, w * tScale, h * tScale, 0.7);
  items.push({ thumb, full, price: 0, qty: 1 });
  render();
};

function loadImage(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(img.src); res(img); };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

function blobUrl(img, w, h, q) {
  const c = document.createElement('canvas');
  c.width = Math.round(w); c.height = Math.round(h);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return URL.createObjectURL(
    dataURItoBlob(c.toDataURL('image/jpeg', q)));
}

function dataURItoBlob(dataURI) {
  const [head, body] = dataURI.split(',');
  const mime = head.match(/:(.*?);/)[1];
  const bin = atob(body);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

function discountOf(amount) {
  if (amount >= 300) return 45;
  if (amount >= 200) return 30;
  if (amount >= 100) return 15;
  return 0;
}

// 自动分组: 贪心"单人优惠最大化"
// 单件展开, 按价从大到小, 当前组装到 ≥300 就封箱开新组;
// 否则若加入能让组升档或保持在 <300 内继续逼近, 就放
// 返回: 数组 of 组, 每组是 [{itemIdx, count}]
function autoGroup() {
  // 展开单件
  const units = [];
  items.forEach((it, idx) => {
    for (let k = 0; k < it.qty; k++) units.push({ idx, price: it.price });
  });
  units.sort((a, b) => b.price - a.price);

  const groups = []; // [{amount, members: Map<itemIdx, count>}]
  let cur = { amount: 0, members: new Map() };

  for (const u of units) {
    const newAmt = cur.amount + u.price;
    // 规则: 放进去让组升档 (discount 增加) 或者还没满 300 且不会跳到 >300
    // 简化: 只要 newAmt <= 300 就放; 如果 newAmt > 300:
    //   若 cur.amount 已 >= 300 -> 封箱开新组, u 进新组
    //   否则 (cur.amount < 300, newAmt > 300) -> 放, 满档封箱
    if (cur.amount >= 300) {
      groups.push(cur);
      cur = { amount: u.price, members: new Map([[u.idx, 1]]) };
      continue;
    }
    if (newAmt <= 300) {
      cur.amount = newAmt;
      cur.members.set(u.idx, (cur.members.get(u.idx) || 0) + 1);
    } else {
      // newAmt > 300, cur.amount < 300: 放进去满档 (减 45)
      cur.amount = newAmt;
      cur.members.set(u.idx, (cur.members.get(u.idx) || 0) + 1);
    }
  }
  if (cur.amount > 0 || cur.members.size > 0) groups.push(cur);
  return groups;
}

function render() {
  pNumEl.textContent = people;
  emptyEl.style.display = items.length ? 'none' : '';
  renderGroups();
  renderList();
  updateSummary();
}

function renderGroups() {
  const groups = autoGroup();
  groupsEl.innerHTML = '';
  groups.forEach((g, gi) => {
    const amount = g.amount;
    const disc   = discountOf(amount);
    const net    = amount - disc;
    const totalQty = [...g.members.values()].reduce((a, b) => a + b, 0);
    const gnum = gi + 1;

    const box = document.createElement('div');
    box.className = 'group' + (openGroups.has(gnum) ? ' open' : '');

    const head = document.createElement('div');
    head.className = 'g-head';
    let statusCls, statusTxt;
    if (amount >= 300)     { statusCls = 'ok';   statusTxt = `减 ¥${disc}（已满档）`; }
    else if (amount >= 100){ statusCls = 'ok';   statusTxt = `减 ¥${disc}`; }
    else                   { statusCls = 'warn'; statusTxt = `差 ¥${(100 - amount).toFixed(2)} 到 100，无优惠`; }
    head.innerHTML = `
      <span class="label">组 ${gnum}</span>
      <span class="stat">${totalQty} 件 · 小计 ¥${amount.toFixed(2)} · 实付 ¥${net.toFixed(2)}</span>
      <span class="${statusCls}">${statusTxt}</span>
      <span class="arrow">▶</span>`;
    if (amount > 300) {
      const warn = document.createElement('span');
      warn.className = 'bad';
      warn.textContent = `超 ¥${(amount - 300).toFixed(2)} 无优惠`;
      head.insertBefore(warn, head.lastElementChild);
    }
    head.onclick = () => {
      openGroups.has(gnum) ? openGroups.delete(gnum) : openGroups.add(gnum);
      box.classList.toggle('open');
    };

    const body = document.createElement('div');
    body.className = 'g-body';
    for (const [idx, count] of g.members) {
      const it = items[idx];
      const row = document.createElement('div');
      row.className = 'g-row';
      const img = document.createElement('img');
      img.src = it.thumb;
      img.onclick = (e) => { e.stopPropagation(); showFull(it.full); };
      const gm = document.createElement('div');
      gm.className = 'gm';
      const line = it.price * count;
      gm.innerHTML = `<div class="gidx">#${idx + 1}</div>
                      <div class="gp">¥${it.price.toFixed(2)} × ${count}（本组）</div>`;
      const gt = document.createElement('div');
      gt.className = 'gt';
      gt.textContent = `¥${line.toFixed(2)}`;
      row.append(img, gm, gt);
      row.onclick = () => jumpToItem(idx);
      body.appendChild(row);
    }

    box.append(head, body);
    groupsEl.appendChild(box);
  });
}

function renderList() {
  listEl.innerHTML = '';
  items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'item';
    row.dataset.idx = i;

    const img = document.createElement('img');
    img.src = it.thumb;
    img.onclick = () => showFull(it.full);

    const mid = document.createElement('div');
    mid.className = 'mid';
    mid.innerHTML = `<div class="idx">#${i + 1}</div>`;
    const input = document.createElement('input');
    input.className = 'price-input';
    input.type = 'number';
    input.inputMode = 'decimal';
    input.placeholder = '输入价格';
    input.value = it.price || '';
    input.oninput = () => { it.price = parseFloat(input.value) || 0; refreshNumbers(); };
    mid.appendChild(input);

    const qty = document.createElement('div');
    qty.className = 'qty';
    const minus = document.createElement('button');
    minus.textContent = '−';
    const n = document.createElement('span');
    n.className = 'n';
    n.textContent = it.qty;
    const plus = document.createElement('button');
    plus.textContent = '+';
    minus.onclick = () => { if (it.qty > 1) { it.qty--; n.textContent = it.qty; refreshNumbers(); } };
    plus.onclick  = () => { it.qty++; n.textContent = it.qty; refreshNumbers(); };
    qty.append(minus, n, plus);
    mid.appendChild(qty);

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.onclick = () => {
      URL.revokeObjectURL(it.thumb);
      URL.revokeObjectURL(it.full);
      items.splice(i, 1);
      render();
    };

    row.append(img, mid, del);
    listEl.appendChild(row);
  });
}

function refreshNumbers() {
  renderGroups();
  updateSummary();
}

function updateSummary() {
  const groups = autoGroup();
  const gross = groups.reduce((a, g) => a + g.amount, 0);
  const save  = groups.reduce((a, g) => a + discountOf(g.amount), 0);
  const net   = gross - save;
  document.getElementById('gross').textContent = `原价 ¥${gross.toFixed(2)}`;
  document.getElementById('save').textContent  = `共省 ¥${save.toFixed(2)}`;
  document.getElementById('net').textContent   = `实付 ¥${net.toFixed(2)}`;
}

function showFull(src) {
  viewer.querySelector('img').src = src;
  viewer.style.display = 'flex';
}
viewer.onclick = () => { viewer.style.display = 'none'; };

function jumpToItem(i) {
  const row = listEl.querySelector(`.item[data-idx="${i}"]`);
  if (!row) return;
  row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  row.classList.remove('flash');
  void row.offsetWidth;
  row.classList.add('flash');
}

render();
</script>
</body>
</html>
